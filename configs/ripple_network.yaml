RIPPLE:
  DIM: 128
  ATOM_INPUT_DIM: 128
  RESIDUE_INPUT_DIM: 1024
  EDGE_DIM: 8
  CONFORMER_LAYERS: 3
  CONFORMER_NEIGHBORS: 16
  RESIDUE_LAYERS: 3
  DRUG_LATENTS: 32
  PROTEIN_LATENTS: 32
  PROPAGATION_STEPS: 5
  PROPAGATION_RESTART: 0.2
  MATCHER_TEMPERATURE: 1.0
  DROPOUT: 0.1
  STRUCTURE_GATE_BIAS: -1.0
  LOCAL_GATE_BIAS: -2.0

  # Pocket-conditioned drug-protein interaction fusion.
  BIINTENTION_HEADS: 8
  BIINTENTION_LAYERS: 1

  NUM_AFFINITY_ENDPOINTS: 4
  NUM_EFFECT_CLASSES: 2
  NUM_MECHANISM_CLASSES: 6

DATA:
  NUM_CONFORMERS: 8
  NUM_POCKETS: 5
  MAX_POCKET_RESIDUES: 96

TRAINING:
  STAGES: [foundation, effect_warmup, channel_finetune]
  FOUNDATION_EPOCHS: 2
  FOUNDATION_VALIDATE_EVERY_STEPS: 1000
  WARMUP_EPOCHS: 5
  FINETUNE_EPOCHS: 30
  FOUNDATION_TASK_RATIO: {measurement: 6, site: 2.5, complex: 1.5}
  FINETUNE_TASK_RATIO: {effect: 6, geometry: 2, replay: 2}
  LEARNING_RATE: 0.0001
  REPLAY_WEIGHT: 0.2
  PATIENCE: 5
  RELIABLE_INTERACTION: false
  BACKBONE_LR_MULTIPLIER: 0.2
  POSE_GOOD_RMSD: 2.0
  LOSS_WEIGHTS:
    INTERACTION: 0.0
    AFFINITY: 1.0
    EFFECT: 1.0
    MECHANISM: 0.0
    NATIVE_POCKET: 1.0
    FUNCTION: 0.0
    POSE_RANK: 0.0
    ALLOSTERIC_POCKET: 0.0
    NONBINDER_DELTA: 0.0
    GEOMETRY_SNAPSHOT: 0.2
    GEOMETRY_RESPONSE: 0.0
    GATING: 0.0
    STATE_PREFERENCE: 0.0
